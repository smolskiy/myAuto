name: CI
on:
  # push — только main: ветка с PR иначе прогонялась бы дважды (push и pull_request).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Права по умолчанию — только чтение; публикация на Pages получает свои права в job `deploy`.
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Ветки и PR: новый push отменяет старый прогон. main не отменяем — начатый деплой должен доехать.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Оба проекта: mobile-chromium (корень `/`) и pages-base (сборка под `/myAuto/`).
      - run: npm run test:e2e -- --project mobile-chromium --project pages-base
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /myAuto/
          VITE_YANDEX_CLIENT_ID: ${{ vars.YANDEX_CLIENT_ID }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v5
